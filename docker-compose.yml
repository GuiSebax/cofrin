services:
  db: 
    image: postgres:16-alpine
    container_name: cofrin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cofrin
      POSTGRES_USER: cofrin
      POSTGRES_PASSWORD: cofrin
    ports:
      - "5432:5432"
    volumes:
      - cofrin-data:/var/lib/postgresql/data

volumes:
  cofrin-data: